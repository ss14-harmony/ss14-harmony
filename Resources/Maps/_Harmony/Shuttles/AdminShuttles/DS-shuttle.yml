- proto: PaperOffice
  entities:
  - uid: 821
    components:
    - type: MetaData
      name: debrief note
    - type: Transform
      parent: 820
    - type: Paper
      stampState: paper_stamp-centcom
      stampedBy:
      - stampedColor: '#006600FF'
        stampedName: stamp-component-stamped-name-centcom
      content: >-
        [head=3]To the DeathSquad members onboard,[/head]


        You have all been tasked to take down {STATION_NAME} Station, due to {CONFLICT}. You are all armed with enough firepower to ensure victory, although we have supplied this shuttle with as much extra stuff as possible, incase something gets lost. This includes items not found within your backpacks.


        To the designated medic, or to the most professional medically trained agent onboard, we have prepared a chemistry for preperation. We highly recommend you use it, as it can provide a multitude of benefits.


        If you are to return before your task is done, which we [bold]highly forbid[/bold], please familiarize yourself with station's escape routes, department areas, et cetera.


        You are valued soldiers of Central Command. You shall not falter. You shall not yield. You cannot, and will not, under any circumstance; disappoint us.


                        [head=3]GLORY TO CENTRAL COMMAND.[/head]
    - type: Physics
      canCollide: False
  - uid: 822
    components:
    - type: MetaData
      name: shuttle contents
    - type: Transform
      parent: 820
    - type: Paper
      stampState: paper_stamp-centcom
      stampedBy:
      - stampedColor: '#006600FF'
        stampedName: stamp-component-stamped-name-centcom
      content: >-
        [head=3]A quick introduction to the NT-Valkyrie[/head]


        BRIDGE: A very protected area of the shuttle, due to it containing the console of flying. We've also supplied it with a fax machine, an IFF computer, and a communications console, along with some other things.


        MEDICAL/CHEMISTRY: Due to it's status, this place bolsters no guns, as to protect the members inside. This place contains top-notch medical equipment, aswell as a full chemistry area. This area also contains the nuclear bomb, incase the station bomb is not to be found.


        CENTER: A small hallway full of gear, including explosives, ammunition, hardsuits and these documents. The docking ports are to the right and left with emergency NTSRA suits, double oxygen/nitrogen tanks and jetpacks.

        [color=darkred][bolditalic]REMEMBER:[/bolditalic][/color] Before departing the shuttle, turn on all the turrets to lethal and remove all authorizations. The turrets are configured to [bolditalic]not[/bolditalic] shoot DeathSquad, ERT and other Central Command members.


        RESTING AREA: A place of relaxation, full of food and drinks for the soldiers. If you request any other items, such as food or guns, please notify a CentComm official, so they can teleport it in via the teleporter.


        ARMORY: To the right of the resting area, we have added some high-grade weapons for you all, aswell as a ammunition techfab, materials and power cells.


        ENGINEERING: This is the powerhouse of the shuttle, make sure it isn't destroyed. This place contains a multitude of things, that being engineering related, as well as carrying tools for grenade making.


        ATMOSPHERICS: Not much is to say about this area, other than the fact that it is your main lifeforce, i.e. distro and waste. This place also contains alot of surplus materials, aswell as plasteel.


                        [head=3]GLORY TO CENTRAL COMMAND.[/head]
