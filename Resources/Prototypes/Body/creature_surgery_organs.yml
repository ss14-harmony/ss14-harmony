# Monkey / carp / dragon surgery torsos and xenograft-tagged internal organs (v2 creature surgery).

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHumanExternal ]
  id: OrganMonkeyTorso
  name: monkey torso
  suffix: ""
  components:
  - type: BodyPart
    containerId: internal_organs
    slots: [ Lungs, Heart, Stomach, Liver, Kidneys, Brain ]
  - type: SurgeryLayer
  - type: ContainerContainer
    containers:
      internal_organs: !type:Container
        showEnts: False
        occludes: True
        ents: []
  - type: EntityTableContainerFill
    containers:
      internal_organs: !type:AllSelector
        children:
        - id: OrganMonkeyLungs
        - id: OrganMonkeyHeart
        - id: OrganMonkeyStomach
        - id: OrganMonkeyLiver
        - id: OrganMonkeyKidneys
        - id: OrganMonkeyBrain

