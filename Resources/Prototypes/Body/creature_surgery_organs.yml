        showEnts: False
        occludes: True
        ents: []
  - type: EntityTableContainerFill
    containers:
      internal_organs: !type:AllSelector
        children:
        - id: OrganSpaceCarpLungs
        - id: OrganSpaceCarpHeart
        - id: OrganSpaceCarpStomach
        - id: OrganSpaceCarpLiver
        - id: OrganSpaceCarpKidneys

- type: entity
