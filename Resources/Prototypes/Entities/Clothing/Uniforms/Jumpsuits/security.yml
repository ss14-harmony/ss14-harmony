- type: entity
  parent: [ClothingUniformBase, BaseSecurityContraband] # Harmony Change: Added Contraband Level
  id: ClothingUniformJumpsuitBrigmedic
  name: brigmedic jumpsuit
  description: This uniform is issued to qualified personnel who have been trained. No one cares that the training took half a day.
  components:
  - type: Sprite
    sprite: _Harmony/Clothing/Uniforms/Jumpsuit/brigmedic.rsi # Harmony resprite Clothing/Uniforms/Jumpsuits/Security/brigmedic.rsi
  - type: Clothing
