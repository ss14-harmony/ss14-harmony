- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: SpeedLoaderLightRifle #Harmony - I know it's a bit risky to keep this as is (not to mention a bit confusing) but it will avoid the need for changing some crates, ammofabs, and at least one wreck.
  name: "speed loader (.27 full-power)" #Harmony change - Use .27 full-power
  description: 5-round 'stripper clip' for quickly reloading the Kardashev-Mosin. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      #- CartridgeLightRifle
      - CartridgeRifleFullPower #Harmony change - Use .27 full-power
    capacity: 5
    #proto: CartridgeLightRifle
    proto: CartridgeRifleFullPower #Harmony change - Use .27 full-power
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/LightRifle/light_rifle_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
# Start Harmony change - Adds speedloader landing sound
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Harmony/Items/rsc_speedloader_impact.ogg
  - type: Tag
    tags:
    - SpeedLoaderRifle
# End Harmony change
