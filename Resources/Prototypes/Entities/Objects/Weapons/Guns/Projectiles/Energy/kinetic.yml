- type: entity
  parent: BaseBullet
  id: BulletKinetic
  categories: [ HideSpawnMenu ]
  name: kinetic bolt
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 25 # Harmony change- DeltaV PKA Rework - 15 -> 25
        Structural: 15
  # Short lifespan
  - type: TimedDespawn
    lifetime: 0.22 # roughly 5.5 tiles
  - type: GatheringProjectile
  - type: PressureProjectile # Harmony change - DeltaV PKA Rework

- type: entity
  parent: BaseBullet
  id: BulletKineticShuttle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 30
        Structural: 35
  - type: Ammo
    muzzleFlash: HitscanEffect
  - type: TimedDespawn
    lifetime: 1.5
  - type: PointLight
    radius: 2.5
    color: white
    energy: 0.5
  - type: GatheringProjectile
  - type: PressureProjectile # Harmony change - DeltaV PKA Rework

- type: entity
  parent: BaseBullet
  id: BulletCharge
  categories: [ HideSpawnMenu ]
  name: charge bolt
  description: Marks a target for additional damage.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Reflective
    reflective:
    - NonEnergy
  - type: GatheringProjectile
  - type: DamageMarkerOnCollide
    whitelist:
      components:
      - MobState
    damage:
      types:
      # Harmony Change - reverts salvage weapon changes
        Blunt: 20 # 18 -> 20
        Slash: 5 # 4 -> 5
      # Harmony end
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 0
  # Short lifespan
  - type: TimedDespawn
    lifetime: 0.4

