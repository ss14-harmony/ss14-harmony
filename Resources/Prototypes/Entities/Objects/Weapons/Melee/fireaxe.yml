- type: entity
  name: fireaxe
  parent: [BaseItem, BaseEngineeringContraband]
  id: FireAxe
  description: Truly, the weapon of a madman. Who would think to fight fire with an axe?
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        # axes are kinda like sharp hammers, you know?
        Blunt: 5
        Slash: 10
        Structural: 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
        Structural: 40
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tool
    qualities:
    - Prying
    - Slicing
    - Sawing
    - Axing # Harmony specific change for allowing the base fireaxe to rip up plating
  - type: ToolTileCompatible
    delay: 5 # Harmony specific change
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: IgniteOnMeleeHit
    fireStacks: -4

- type: entity
  id: FireAxeFlaming
  name: fire axe
  parent: [BaseSyndicateContraband, FireAxe]
  # Start Harmony change - changed description
  # description: Why fight fire with an axe when you can fight with fire and axe? Now featuring rugged rubberized handle!
  description: Everything except the handle is scalding to the touch. Throwing this could probably deal massive damage to your foes.
  # End Harmony change
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
  - type: IgniteOnMeleeHit
    fireStacks: 1
  - type: Sprite
    # Harmony change - Changed sprite path
    sprite: _Harmony/Objects/Weapons/Melee/fireaxeflaming.rsi
    # End Harmony change
    state: icon
  - type: Clothing
    # Harmony change - Changed sprite path
    sprite: _Harmony/Objects/Weapons/Melee/fireaxeflaming.rsi
    # End Harmony change
    quickEquip: false
    slots:
    - back
    # Start of Harmony specific additions
    - suitStorage
  - type: StaminaDamageOnEmbed
    damage: 60
  - type: EmbeddableProjectile
    sound: /Audio/_Harmony/Weapons/axe_hit.ogg
    params:
      pitch: 1
      volume: 3
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 50 # ignores resistances
  - type: EmitSoundOnThrow
    sound:
      path: /Audio/Weapons/bolathrow.ogg
      params:
        pitch: 0.8
        volume: -3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
        Heat: 10
        Structural: 40
  - type: Tool
    qualities:
    - Prying
    - Slicing
    - Sawing
  # End of Harmony specific additions
