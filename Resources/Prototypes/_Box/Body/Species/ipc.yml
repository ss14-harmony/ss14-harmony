- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  name: IPC appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganIPCTorso
      Head: OrganIPCHead
      ArmRight: OrganIPCArmRight
      HandRight: OrganIPCHandRight
      ArmLeft: OrganIPCArmLeft
      HandLeft: OrganIPCHandLeft
      LegLeft: OrganIPCLegLeft
      FootLeft: OrganIPCFootLeft
      LegRight: OrganIPCLegRight
      FootRight: OrganIPCFootRight
      Brain: OrganIPCProcessorHousing
      Eyes: OrganIPCEyes
      Ears: OrganIPCEars
      Heart: OrganIPCPump
      Stomach: OrganIPCStomach
      Tongue: OrganIPCTongue
  - type: HumanoidProfile
    species: IPC

- type: entity
  parent: [AppearanceIPC, BaseSpeciesMob, MobBloodstream, MobAtmosStandard, MobFlammable] # No Mobrespirator because Oxygen is not required for the certainty of steel
  id: MobIPC
  name: Urist McPositronic
  components:
    # copied over from BaseSpeciesMobOrganic and made changes based on the original BaseSpeciesMobSilicon
    # if anything gets added or removed from over there it should be mirrored here
    # Excluded components: Perishable and Respirator
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.5
        Heat: 0.3 # represents internal fluids, like coolant and lubricant, boiling away\
  - type: PassiveDamage # IPCs can heal their own bloodloss (to an extent)
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.02
        Blunt: -0.02
  - type: Fingerprint # IPCs have fingerprints
  - type: Blindable
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 373.15 # damage point of electronics
    coldDamageThreshold: 200 # takes into account freezing point of structural elements, like plastics, and the freezing point of internal chemicals
    coldDamage:
      types:
        Cold: 0.1 # per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 2
        Shock: 1 # Represents Components overheating with electrical issues resulting
  - type: ThermalRegulator # Completely new component so left unchanged from BaseOrganic
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: FireVisuals
  - type: StunVisuals
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  # No more Mirroring from this point on
  - type: Tag # Mirrored from BaseSpeciesMob (i lied)
    tags:
      - CanPilot
      - FootstepSound
      - DoorBumpOpener
      - AnomalyHost # IPCs can be anomaly hosts
      - SiliconEmotes # added
  - type: Damageable
    damageModifierSet: IPC
  - type: Injurable
    damageContainer: HumanoidSilicon
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
      - "enum.HumanoidVisualLayers.Chest"
      - "enum.HumanoidVisualLayers.Head"
      - "enum.HumanoidVisualLayers.LArm"
      - "enum.HumanoidVisualLayers.LLeg"
      - "enum.HumanoidVisualLayers.RArm"
      - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#DD8822"
  - type: Deathgasp
    prototype: SiliconDeathgasp
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      119.999: Critical # Make it near impossible
      120: Dead
    stateAlertDict:
      # change health states from BorgHealth to IpcHealth, Needed for Numb to work and not also have it apply to Borgs (Unless we want that?)
      #Alive: BorgHealth
      #Critical: BorgCrit
      #Dead: BorgDead
      Alive: IpcHealth
      Critical: IpcCrit
      Dead: IpcDead
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Speech
    speechSounds: Pai
  - type: Vocal
    wilhelm: "/Audio/_EE/Voice/IPC/wilhelm.ogg"
    emotesounds: UnisexIPC
  # stuff that makes the IPC do IPC things
  - type: Silicon
    entityType: enum.SiliconType.Player
    batteryPowered: true
    drainPerSecond: 0.6
    idleDrainReduction: 0.9
    chargeThresholdMid: 0.80
    chargeThresholdLow: 0.35
    chargeThresholdCritical: 0.10
    speedModifierThresholds:
      4: 1
      3: 1
      2: 0.80
      1: 0.45
      0: 0.2
  - type: BatteryDrinker
  - type: DeadStartupButton
    sound:
      path: /Audio/_EE/Effects/Silicon/startup.ogg
  - type: SiliconDownOnDead
  - type: EmitBuzzWhileDamaged
  - type: CanHostGuardian
  # - type: WeldingHealable # Commented out pending damageable system fixes
  - type: CombatMode # DeltaV - let IPCs disarm
    canDisarm: true
  - type: Bloodstream
    damageBleedModifiers: BloodlossIPC
    bloodReferenceSolution:
      reagents:
        - ReagentId: IPCOil # IPC blood effectively
          Quantity: 600
    bleedReductionAmount: 0.25 # Less than an organic (no clotting), but still there
    bleedPuddleThreshold: 3
    bloodRefreshAmount: 0
    bloodlossThreshold: 0.7 # IPCs bleed for longer and cannot restore blood naturally. Bleeding should punish them less.
    bloodlossDamage:
      types:
        Blunt: 0.25
        Heat: 0.25
    bloodlossHealDamage:
      types:
        Burn: 0
  - type: TypingIndicator
    proto: ipc
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 400
        behaviors:
        - !type:GibBehavior { }
      # makes IPCs able to have ashing like behavior
      - trigger:
          !type:DamageTypeTrigger
          damageType: Heat
          damage: 2000 # Metal is normally harder to melt than a person, so "ashing" threshold is higher
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawnInContainer: true
          spawn:
            MoltenIPCScrap:
              min: 1
              max: 1
        - !type:BurnBodyBehavior { } # TODO: Wait for the upstream PR that makes it so a custom popup can be made
        - !type:PlaySoundBehavior
          sound:
            collection: MeatLaserImpact # Either this sound doesn't appear, or it already works good enough
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: BatterySlotRequiresLock
    itemSlot: cell_slot
  - type: SiliconEmitSoundOnDrained
    sound: "/Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg" # SOMEONE PLEASE FIND A BETTER SOUND FOR THIS.
    minInterval: 99
    maxInterval: 99
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
    lockTime: 5
    unlockTime: 5
  - type: Inventory
    templateId: ipc # does this do anything? NO IDEA
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
      - Cold
      - Caustic
      - Radiation
    locPrefix: ipc # unique flavor text for ipc injuries
  - type: GuideHelp
    guides:
      - IPC

