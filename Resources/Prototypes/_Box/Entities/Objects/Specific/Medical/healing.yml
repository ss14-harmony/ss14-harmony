- type: entity
  name: chassis patch
  description: A self-adhering metallic mesh capable of patching gashes in robots. A good way to stop bleeding.
  parent: BaseHealingItem
  id: ChassisPatch
  suffix: Full, Box
  components:
  - type: Sprite
    sprite: _Box/Objects/Medical/chassis_patch.rsi
    state: icon
  - type: Item
    sprite: _Box/Objects/Medical/chassis_patch.rsi
    heldPrefix: icon
  - type: Construction
    graph: ChassisPatch
    node: icon
  - type: Healing
    damageContainers:
      - HumanoidSilicon
    damage:
      types:
        Slash: -5
        Piercing: -10
        Blunt: -1
    bloodlossModifier: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: ChassisPatch
    count: 10
  - type: StackPrice
    price: 10
  - type: Tag
    tags:
    - IPCTopical

- type: entity
  id: ChassisPatch1
  parent: ChassisPatch
  suffix: Single, Box
  components:
  - type: Stack
    count: 1
