- type: entity
  parent: BaseGameRule
  id: HitmanRule
  components:
  - type: GameRule
  - type: AntagObjectives
    objectives:
    - EscapeShuttleObjectiveHitman
    - HitmanTeachLessonRandomPersonObjective
  - type: AntagRandomObjectives
    sets:
    - groups: HitmanObjectiveGroup
      maxPicks: 2 # i would rather it be tied to diffculty but if it wont assign a objective if it goes over difficulty this works
    maxDifficulty: 300
  - type: AntagSelection
    agentName: hitman-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Hitman ]
      max: 2
      playerRatio: 30 #a bit more impactful than thief which DV has at 25 so
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: HitmanGear
      mindRoles:
      - MindRoleHitman
      briefing:
        text: hitman-role-greeting-human
        color: yellow
        sound: "/Audio/_DV/Ambience/Antag/hitman_briefing_piano_between.ogg"