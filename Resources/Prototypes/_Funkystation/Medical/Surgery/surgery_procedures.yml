  emoteCompleteOthers: surgery-procedure-emote-clamp-vessels-complete-others
  penalty: 1
  primaryTool:
    tag: HemostatTool
    doAfterDelay: 2
    damage:
      types:
        Slash: 4
    sound: /Audio/Items/drill_hit.ogg
  improvisedTools:
    - tag: Wirecutter
      delayMultiplier: 1.5
  prerequisites:
    - type: RequireStepPerformed
      procedure: CreateIncision

- type: surgeryProcedure
