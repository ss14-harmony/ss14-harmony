# Surgery procedures - data-driven (primary tool, improvised tool) pairs.
# Replaces surgery_steps.yml. Used by BodyPartSurgeryStepsPrototype and OrganSurgeryProceduresComponent.
# Locale: descriptions & step popups in Resources/Locale/en-US/medical/surgery-procedures.ftl

# === Skin layer (6 steps) ===

- type: surgeryProcedure
  id: CreateIncision
  layer: Skin
  name: health-analyzer-surgery-step-create-incision
  description: surgery-procedure-desc-create-incision
  emoteStartSelf: surgery-procedure-emote-create-incision-start-self
  emoteStartOthers: surgery-procedure-emote-create-incision-start-others
  emoteCompleteSelf: surgery-procedure-emote-create-incision-complete-self
  emoteCompleteOthers: surgery-procedure-emote-create-incision-complete-others
  penalty: 1
  primaryTool:
    tag: CuttingTool
    doAfterDelay: 2
    damage:
      types:
        Slash: 5
    sound: /Audio/Weapons/bladeslice.ogg
  improvisedTools:
    - damageType: Slash
      delayMultiplier: 1.5
  prerequisites:
    - type: RequireLayerClosed
      layer: Skin

- type: surgeryProcedure
  id: ClampVessels
  layer: Skin
  name: health-analyzer-surgery-step-clamp-vessels
  description: surgery-procedure-desc-clamp-vessels
