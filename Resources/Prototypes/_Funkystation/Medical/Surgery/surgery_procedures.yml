  primaryTool:
    tag: ManipulatingTool
    doAfterDelay: 2
    healAmount:
      types:
        Slash: -2
    sound: /Audio/Effects/lightburn.ogg
  improvisedTools:
    - damageType: Blunt
      delayMultiplier: 1.5
  prerequisites:
