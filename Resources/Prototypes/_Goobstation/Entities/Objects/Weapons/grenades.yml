- type: entity
  parent: [ SmokeGrenade , BaseSyndicateContraband ]
  id: SarinGasGrenade
  name: sarin gas grenade
  description: A brutal nerve agent gas that stuns, blinds, and poisons anybody unlucky enough to catch a whiff aswell as burning anyone not in a voidsuit.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger # Lower duration and you wont even crit from the caustic if you have internals on, mainly useful for area denial
    duration: 20 # drop duration to 15 if it's a problem (wont crit from caustic) keep in mind this includes time spreading (~5 secs)
    spreadAmount: 30
    solution:
      reagents:
      - ReagentId: Sarin
        Quantity: 50
