- type: entity
  parent: BaseAction
  id: ActionMalfShop
  name: Spend Processing Power
  description: Spend your processing power to unlock new abilities.
  components:
  - type: Action
    icon: Interface/Actions/shop.png
  - type: InstantAction
    event: !type:MalfShopActionEvent

- type: entity
  parent: BaseAction
  id: ActionMalfDoomsday
  name: Activate Doomsday Device
  description: Activate a doomsday device, eradicating the entire crew after 450 seconds. Cancelled if you are deactivated in any form.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Devices/nuke.rsi
      state: nuclearbomb_base
  - type: InstantAction
    event: !type:MalfDoomsdayStartEvent
  - type: LimitedCharges
    maxCharges: 1 # if you want to try again hack another 18 APCs

- type: entity
  parent: BaseAction
  id: ActionMalfLockdown
  name: Lockdown
  description: Close and bolt all on-station airlocks for 90 seconds.
  components:
  - type: Action
    useDelay: 90 # shows the duration of the lockdown. because you only get 1 use the cooldown is only visual anyway
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: knock
  - type: InstantAction
    event: !type:MalfLockdownEvent
  - type: LimitedCharges
    maxCharges: 1