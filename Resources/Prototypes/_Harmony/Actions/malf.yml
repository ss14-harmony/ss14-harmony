- type: entity
  parent: BaseAction
  id: ActionMalfShop
  name: Spend Processing Power
  description: Spend your processing power to unlock new abilities.
  components:
  - type: Action
    icon: Interface/Actions/shop.png
  - type: InstantAction
    event: !type:MalfShopActionEvent

- type: entity
  parent: BaseAction
  id: ActionMalfDoomsday
  name: Activate Doomsday Device
  description: Activate a doomsday device, eradicating the entire crew after 450 seconds. Cancelled if you are deactivated in any form.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Devices/nuke.rsi
      state: nuclearbomb_base
  - type: InstantAction
    event: !type:MalfDoomsdayStartEvent
  - type: LimitedCharges
    maxCharges: 1 # if you want to try again hack another 9 APCs

- type: entity
  parent: BaseAction
  id: ActionMalfOverloadMachine
  name: Overload Machine
  description: Detonate a device connected to an APC. Does not work if the machine is not powered.
  components:
  - type: Action
    priority: 2
    itemIconStyle: BigAction
    icon: 
      sprite: Objects/Weapons/Grenades/syndgrenade.rsi
      state: icon
  - type: TargetAction
    range: 0
    checkCanAccess: false
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:MalfOverloadMachineActionEvent
    whitelist: 
      components:
      - ApcPowerReceiver
  - type: LimitedCharges
    maxCharges: 3

- type: entity
  parent: BaseAction
  id: ActionMalfHackApc
  name: Hack APC
  description: Hack an APC, gaining 20 processing power. Hacked APCs are obvious, so hide them well. 30 second cooldown.
  components:
  - type: Action
    priority: 1
    useDelay: 30
    icon: 
      sprite: Structures/Power/apc.rsi
      state: static
  - type: TargetAction
    range: 0
    checkCanAccess: false
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:MalfHackApcActionEvent
    whitelist: 
      components:
      - Apc

- type: entity
  parent: BaseAction
  id: ActionMalfOverrideAia
  name: Override AI Access
  description: Override the AI access permissions of any device.
  components:
  - type: Action
    priority: 3
    itemIconStyle: BigAction
    icon: 
      sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
      state: icon
  - type: TargetAction
    range: 0
    checkCanAccess: false
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:MalfOverrideAiaActionEvent
    whitelist: 
      components:
      - StationAiWhitelist
  - type: LimitedCharges
    maxCharges: 1