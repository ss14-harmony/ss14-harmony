- type: entity
  parent: BaseAction
  id: ActionToggleMantisGloves
  name: Toggle mantis blades
  description: Extends or retracts the deadly blades in your gloves.
  components:
  - type: Action
    useDelay: 1.0
    icon:
      sprite: _Harmony/Clothing/Hands/Gloves/mantis_activated.rsi
      state: icon
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseImplantAction
  id: ActionActivateHyperzineImplant
  name: Inject stimulants
  description: Injects you with 90 seconds worth of hyperzine.
  components:
  - type: LimitedCharges
    maxCharges: 3
  - type: Action
    targetUser: true
    checkCanInteract: false
    useDelay: 120
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Specific/Medical/medipen.rsi
      state: stimpen
