- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckHeadphonesCat
  name: purple headphones with ears
  description: pretty purple headphones with plastic cat ears, perfect for listening to nightcore.
  components:
  - type: Sprite
    sprite: _Harmony/Clothing/Neck/Misc/headphones_purpul_cat.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleVisuals.Layer" ]
  - type: Clothing
    equippedPrefix: off
    sprite: _Harmony/Clothing/Neck/Misc/headphones_purpul_cat.rsi
  - type: ToggleableLightVisuals
    spriteLayer: enum.ToggleVisuals.Layer
    clothingVisuals:
      neck:
      - state: on-equipped-NECK
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg