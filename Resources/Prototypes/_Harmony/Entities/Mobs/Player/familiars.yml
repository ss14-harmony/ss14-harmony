- type: entity
  parent: MobLizard
  id: MobLizardGizzard
  name: Gizzard, the Lizard Wizard
  suffix: Harmony
  description: Sometimes you think you're the magic potion.
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: gizzard
      sprite: _Harmony/Mobs/Pets/gizzard.rsi
  - type: GhostRole
    makeSentient: true
    allowMovement: true
    allowSpeech: true
    name: ghost-role-information-gizzard-name
    description: ghost-role-information-gizzard-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: Grammar
    attributes:
      gender: male
      proper: true
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Access
    tags:
    - Wizard
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: Familiar
  - type: DamageStateVisuals
    states:
      Alive:
        Base: gizzard
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
  - type: TypingIndicator
    proto: lizard
  - type: ActionGrant
    actions:
    - ActionBlink
    - ActionPolymorphJauntII
    - ActionWehball
  - type: Puller
    needsHands: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 3
