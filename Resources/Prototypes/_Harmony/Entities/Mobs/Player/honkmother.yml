- type: entity
  abstract: true
  id: MobHonkmotherBase
  name: Honk Mother
  description: 500-foot nightmare stitched from painted clown flesh
  components:
    - type: Sprite
      sprite: Mobs/Demons/honkmother.rsi
      drawdepth: Ghosts
      scale: 2.0,2.0
      layers:
        - state: honkmother
          shader: unshaded

# spawn animation, spawns actual honkmother when it ends
- type: entity
  parent: MobHonkmotherBase
  id: MobHonkmotherSpawn
  suffix: Spawn
  components:
    - type: Sprite
      layers:
        - state: spawn
          shader: unshaded
    # spawn animation lasts 3 seconds
    - type: TimedDespawn
      lifetime: 3
    - type: SpawnOnDespawn
      prototype: MobHonkmother

- type: entity
  parent: [MobNHonkmotherBase, BaseMob]
  id: MobHonkmother
  components:
    - type: AnnounceOnSpawn
      message: honkmother-has-risen
      sender: honkmother-has-risen-sender
      sound:
        path: /Audio/Misc/narsie_rises.ogg
      color: red
    - type: CargoSellBlacklist
    # big honkmother needs to see the universe
    - type: ContentEye
      maxZoom: 2.0,2.0
    - type: Fixtures
      fixtures:
        EventHorizonCollider:
          shape:
            !type:PhysShapeCircle
            radius: 5
          hard: false
          restitution: 0.8
          density: 99999
          mask:
            - AllMask
          layer:
            - AllMask
        EventHorizonConsumer:
          shape:
            !type:PhysShapeCircle
            radius: 5
          hard: false
          mask:
            - AllMask
          layer:
            - AllMask
    - type: Input
      context: "ghost"
    - type: MovementIgnoreGravity
    # Honkmother hears all
    - type: IntrinsicRadioReceiver
    - type: ActiveRadio
      channels:
        - Binary
        - Common
        - Command
        - CentCom
        - Engineering
        - Medical
        - Science
        - Security
        - Service
        - Supply
        - Syndicate
      globalReceive: true
    - type: Physics
      bodyType: Dynamic
      bodyStatus: InAir
    - type: CanMoveInAir
    # singulose components
    - type: EventHorizon
      radius: 5
      canBreachContainment: true
    - type: GravityWell
      baseRadialAcceleration: 6
      maxRange: 8
    - type: WarpPoint
      follow: true
      location: Honk Mother