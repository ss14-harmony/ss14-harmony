- type: entity
  name: lich
  parent: MobSkeletonPerson
  id: MobSkeletonLich
  components:
  - type: Loadout
    prototypes: [WizardLichGear]
  - type: RandomHumanoidAppearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:GibBehavior { }

- type: entity
  id: LichBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_Harmony/Effects/greenbeam.rsi
    drawdepth: Effects
    layers:
    - state: greenbeam
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Beam
  - type: TimedDespawn
    lifetime: 4
  - type: Tag
    tags:
    - HideContextMenu
