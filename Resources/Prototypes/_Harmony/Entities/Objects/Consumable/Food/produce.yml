- type: entity
  name: bingle berries
  description: bing bingle
  id: FoodBingleBerries
  parent: ProduceBase
  components:
  - type: FlavorProfile
    flavors:
    - chewy
    - pit
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: SpaceDrugs
          Quantity: 5
        - ReagentId: Cryptobiolin
          Quantity: 4
  - type: Sprite
    sprite: _Harmony/Objects/Specific/Hydroponics/bingle_berries.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: bingleberries
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceBingleBerry
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
    
- type: entity
  parent: FoodProduceBase
  id: FoodPeanut
  name: peanut
  suffix: Harmony
  description: An earthy ground nut, usually processed for peanut butter.
  components:
  - type: FlavorProfile
    flavors:
      - peanut
  - type: Tag
    tags:
    - Peanut
    - Vegetable # this hurts me. legume moment.
    - Fruit # technically a dry fruit + i want lizards to be able to eat it
  - type: Solution
    solution:
      reagents:
      - ReagentId: PeanutButter
        Quantity: 5
      - ReagentId: Nutriment
        Quantity: 5
  - type: Sprite
    sprite: _Harmony/Objects/Specific/Hydroponics/peanut.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: peanut
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: PeanutButter
        Quantity: 10
