- type: entity
  id: HarmonyBattlePass
  name: Harmony Battle Pass
  parent: [ BaseItem, BaseSyndicateContraband ]
  description: Win Big. Antag tokens might be inside.
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Fun/HarmonyBattlePass.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SpawnItemsOnUse
    items:
    - id: HarmonyBattlePassCard
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  id: HarmonyBattlePassCard
  name: Harmony Battle Pass Card
  parent: [ BaseItem, StorePresetUplink, BaseSyndicateContraband ]
  description: Insert TC to Continue.
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Fun/HarmonyBattlePass.rsi
    state: open
  - type: Item
    size: Small
