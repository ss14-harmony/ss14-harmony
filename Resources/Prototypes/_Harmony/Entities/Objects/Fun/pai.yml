
- type: entity
  parent: BaseMentalAction
  id: ActionPAIAtmosSensor
  name: Atmospheric Sensor
  description: Scan the environment or any nearby containers for gas levels.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: Objects/Specific/Atmos/gasanalyzer.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.GasAnalyzerUiKey.Key

- type: entity
  id: PAIAtmosSensorDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: GasAnalyzer
