
- type: entity
  parent: BaseMentalAction
  id: ActionPAIStationRecords
  name: Station Records
  description: Open the station records and dox your owner.
  components:
  - type: Action
    icon: { sprite: Objects/Misc/folders.rsi, state: folder-centcom }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.GeneralStationRecordConsoleKey.Key

- type: entity
  parent: BaseMentalAction
  id: ActionPAIAtmosSensor
  name: Atmospheric Sensor
  description: Scan the environment or any nearby containers for gas levels.
  components:
  - type: Action
    icon: { sprite: Objects/Specific/Atmos/gasanalyzer.rsi, state: icon }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:OpenUiActionEvent
      key: enum.GasAnalyzerUiKey.Key

