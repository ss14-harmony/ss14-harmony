# Geode
- type: entity
  parent: OreBase
  id: Geode
  name: geode
  description: A pretty-looking formation of crystals inside a rock housing. It looks expensive.
  suffix: Full, Harmony
  components:
  - type: Stack
    stackType: Geode
  - type: Sprite
    sprite: _Harmony/Objects/Materials/geode.rsi
    state: geode
  - type: Item
    sprite: _Harmony/Objects/Materials/geode.rsi
    size: Normal
  - type: StackPrice # TODO - make this instead drop random ore when cracked open
    price: 75

- type: entity
  parent: Geode
  id: Geode1
  suffix: Single, Harmony
  components:
  - type: Stack
    count: 1

# Buried Cache
- type: entity
  parent: BaseItem
  id: BuriedCache
  name: buried cache
  description: A buried tube, filled with lost treasure. It has been aged by time.
  suffix: Harmony
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Materials/buried_cache.rsi
    state: buried_cache
  - type: Item
    sprite: _Harmony/Objects/Materials/buried_cache.rsi
    storedRotation: 90
    size: Small
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask:
          - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: SpawnItemsOnUse # TODO - try and replace this with a loot table with weights
    items:
    - id: SpaceCash100
      amount: 3
      orGroup: BuriedTreasure
    - id: SpaceCash1000
      orGroup: BuriedTreasure
    - id: IngotGold1
      amount: 10
      orGroup: BuriedTreasure
    - id: TreasureCoinGold
      prob: 0.5
      amount: 3
      orGroup: BuriedTreasure
    - id: BlueprintDoubleEmergencyTank
      prob: 0.33
      orGroup: BuriedTreasure
    - id: BlueprintFulton
      prob: 0.33
      orGroup: BuriedTreasure
    - id: BlueprintSeismicCharge
      prob: 0.33
      orGroup: BuriedTreasure
    - id: DoubleEmergencyOxygenTankFilled
      orGroup: BuriedTreasure
    - id: DoubleEmergencyNitrogenTankFilled
      orGroup: BuriedTreasure
    - id: WeaponCrusherDagger
      orGroup: BuriedTreasure
    - id: PowerCellHighPrinted
      orGroup: BuriedTreasure
    - id: ClothingBeltSalvageWebbing
      prob: 0.5
      orGroup: BuriedTreasure
    - id: ClothingOuterHardsuitSalvage
      prob: 0.2
      orGroup: BuriedTreasure
    - id: PKAUpgradeDamage
      prob: 0.5
      orGroup: BuriedTreasure
    - id: PKAUpgradeRange
      prob: 0.5
      orGroup: BuriedTreasure
    - id: PKAUpgradeFireRate
      prob: 0.5
      orGroup: BuriedTreasure
    - id: ResearchDisk
      orGroup: BuriedTreasure
    - id: TreasureDatadiskEncrypted
      orGroup: BuriedTreasure
    - id: GoldRing
      orGroup: BuriedTreasure
    - id: SilverRing
      orGroup: BuriedTreasure
    - id: SilverRingGem
      prob: 0.5
      orGroup: BuriedTreasure
