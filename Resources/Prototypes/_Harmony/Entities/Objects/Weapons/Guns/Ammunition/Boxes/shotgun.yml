- type: entity
  name: shell box (hypo)
  parent: [AmmoProviderShotgunShell, BaseSyndicateContraband]
  id: BoxShellHypo
  components:
  - type: BallisticAmmoProvider
    proto: ShellHypo
    capacity: 4
  - type: MagazineVisuals
    magState: mag-hypo
    steps: 5
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Guns/Ammunition/Boxes/shotgun.rsi
    layers:
      - state: hypo
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-hypo-1
        map: ["enum.GunVisualLayers.Mag"]


- type: entity
  parent: AmmoProviderShotgunShell
  id: BoxShotgunBreaching
  name: ammunition box (.50 breaching)
  description: A cardboard box of .50 shotgun shells. Intended to hold specialized breaching ammunition.
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgunBreaching
    - type: MagazineVisuals
      magState: mag-breaching
      steps: 5
    - type: Sprite
      sprite: _Harmony/Objects/Weapons/Guns/Ammunition/Boxes/shotgun.rsi
      layers:
      - state: breaching
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-breaching-1
        map: ["enum.GunVisualLayers.Mag"]
