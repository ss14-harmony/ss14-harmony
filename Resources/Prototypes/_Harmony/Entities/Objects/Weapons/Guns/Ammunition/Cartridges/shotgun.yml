- type: entity
  id: ShellHypo
  name: shell (.50 hypo)
  parent: [BaseSyndicateContraband, BaseShellShotgun]
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
    - state: hypo
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunTranquilizer
  - type: ChemicalAmmo
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 7
  - type: RefillableSolution
    solution: ammo
  - type: InjectableSolution
    solution: ammo
  - type: SolutionTransfer
    maxTransferAmount: 7
  - type: SpentAmmoVisuals
    state: "hypo"

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband]
  id: ShellShotgunBreaching
  name: shell (.50 breaching)
  description: The standard cartridge used by most modern shotguns. Breaching rounds are specialist slugs that do a lot of damage to structures but are ineffective on flesh. Breaks up ineffectively beyond short range.
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
    - state: breaching
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunBreaching
  - type: SpentAmmoVisuals
    state: "breaching"
