- type: entity # components are added to turrets once they are upgraded
  id: WeaponEnergyTurretAIUpgrades
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Gun
    fireRate: 3.75 # 2.5x fire rate
    projectileSpeed: 15
    soundGunshot: 
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: BatteryWeaponFireModes # cheaper firing since otherwise it won't recharge fast enough
    fireModes:
    - proto: BulletEnergyTurretDisabler
      fireCost: 40
    - proto: BulletEnergyTurretLaser
      fireCost: 40
