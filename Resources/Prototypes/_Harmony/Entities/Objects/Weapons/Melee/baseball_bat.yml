  - type: MeleeWeapon
    damage:
      types:
        Blunt: 11
        Structural: 7
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 7
        Structural: 13
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
  - type: Construction
