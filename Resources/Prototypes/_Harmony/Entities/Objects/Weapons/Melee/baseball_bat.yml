- type: entity
  name: barbed wire bat
  parent: BaseBallBat
  id: barbedWireBat
  description: You feel like you're capable of damn near anything when you hold this.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
        Slash: 2
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
  - type: Construction
    graph: WiredBat
    node: barbedbat
  - type: PhysicalComposition
    materialComposition:
      Wood: 250
      Metal: 50
  - type: Tag
    tags:
    - WiredBat

- type: entity
