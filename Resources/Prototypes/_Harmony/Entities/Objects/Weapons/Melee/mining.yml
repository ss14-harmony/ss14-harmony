# pickaxe that swings faster but has less dps

- type: entity
  parent: BaseItem # Not parented from Pickaxe, as thats scrappable and this is tech unlocked
  id: PickaxeLight
  name: lightweight pickaxe
  description: Light, sleek, concerningly made out of glass...
  components:
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Melee/pickaxe_light.rsi
    state: pickaxe
  - type: MeleeWeapon
    attackRate: 1
    wideAnimationRotation: -135
    soundHit:
      path: /Audio/Weapons/smash.ogg
      params:
        volume: -3
    damage:
      groups:
        Brute: 3
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 3
      types:
        Structural: 30
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    - 1,1,1,2
    sprite: _Harmony/Objects/Weapons/Melee/pickaxe_light.rsi
    storedRotation: -45
  - type: UseDelay

# reinforced pickaxe that swings fast

- type: entity
  parent: PickaxeLight
  id: PickaxeUltralight
  name: ultralight pickaxe
  description: Light, sleek, reinforced with plasma! It's still made out of glass though...
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Melee/pickaxe_ultralight.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      groups:
        Brute: 6
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 6
      types:
        Structural: 30
  - type: Item
    sprite: _Harmony/Objects/Weapons/Melee/pickaxe_ultralight.rsi
