- type: entity
  parent: BaseStationEventShortDelay
  id: CarpMigration
  components:
  - type: StationEvent
    earliestStart: 30
    minimumPlayers: 15
    weight: 2
  - type: MeteorSwarm
    announcement: station-event-carp-migration-start-announcement
    announcementSound: /Audio/Announcements/attention.ogg
    meteorVelocity: 45
    meteors:
      MobCarp: 10
      MobCarpRainbow: 1

- type: entity
  parent: BaseGameRule
  id: BingleSpawn
  components:
  - type: StationEvent
    weight: 3.5 # Equal to a Dragon
    duration: null
    earliestStart: 30
    reoccurrenceDelay: 90 # 1h30 between each bingle
    minimumPlayers: 20
  - type: RandomSpawnRule
    prototype: SpawnPointGhostBinglePrime

- type: entity
  parent: BaseStationEvent
  id: LandmineSpawn
  components:
  - type: StationEvent
    earliestStart: 30
    weight: 2
    reoccurrenceDelay: 20
    minimumPlayers: 10
    announcement: station-event-carp-migration-start-announcement
    announcementSound: /Audio/Announcements/attention.ogg
  - type: RandomSpawnRule
    prototype: LandMineModular
  - type: StorageFill
    contents:
    - id: BikeHorn
      prob: 0.6
    - id: ExplosivePayload
      prob: 0.4
