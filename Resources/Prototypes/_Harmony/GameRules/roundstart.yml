# DeathMatch PROMOD Gear

- type: startingGear
  id: DeathMatchPROMODGear
  equipment:
    jumpsuit: ClothingUniformRandomStandard
    back: ClothingBackpack
    ears: ClothingHeadsetGrey
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsJack
    pocket1: MagazinePistol
    pocket2: MagazinePistol
  inhand:
    - WeaponPistolMk58
#  storage: # can't put starting gear in backpack. works for nukies, not for DM.
#    back:
#      - MagazinePistol
#      - MagazinePistol

- type: entity
  parent: BaseStationEventShortDelay
  id: ExtendedHarmonyAnnouncement
  components:
  - type: StationEvent
    endAnnouncement: station-event-harmony-extended-announcement
    maxOccurrences: 1
    endAudio:
      path: /Audio/_Harmony/Announcements/attention_alt.ogg
    duration: 1500 # 25 mins
  - type: EmptyRule

- type: entity
  parent: BaseTraitorRule
  id: Marauder
  components:
  - type: TraitorRule
    giveBriefing: false # custom briefing.
  - type: AntagRandomObjectives
    maxDifficulty: 0 # no random objectives
  - type: AntagObjectives
    objectives:
    - DieObjective
  - type: GameRule
    minPlayers: 20 # no hydrogen bombs against the coughing baby of a lowpop crew with little security
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Marauder ]
      max: 1
      playerRatio: 1
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: false
      mindRoles:
      - MindRoleMarauder
      briefing:
        text: marauder-role-greeting
        color: Crimson # make it stand out. dark, crimson, red and evil.
        sound: /Audio/Ambience/Antag/traitor_start.ogg

- type: entity
  parent: BaseGameRule
  id: MarauderChance # for the Traitor gamemode.
  components:
  - type: SubGamemodes
    rules:
    - id: Marauder
      prob: 0.5
  
- type: entity
  parent: BaseGameRule
  id: ThiefChance
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5

- type: entity
  parent: BaseGameRule
  id: Conspirators
  components:
  - type: GameRule
    minPlayers: 28 # minimum of 4 conspirators
  - type: ConspiratorRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Conspirator ]
      min: 4
      max: 7
      playerRatio: 7
      briefing:
        text: conspirator-role-greeting
        color: "#724F29"
        sound: /Audio/_Harmony/Misc/conspirator_greeting.ogg
      components:
      - type: Conspirator
      - type: AutoImplant
        implants:
        - RadioImplantConspiracy
      mindRoles:
      - MindRoleConspirator
