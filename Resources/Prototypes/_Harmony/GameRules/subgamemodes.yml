- type: entity
  parent: BaseGameRule
  id: BloodBrothers
  components:
  - type: GameRule
    minPlayers: 10
    cancelPresetOnTooFewPlayers: false
    delay:
      min: 240
      max: 420
  - type: BloodBrotherRule
  - type: AntagRandomObjectives
    sets:
    - groups: BloodBrotherObjectiveGroups
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: blood-brothers-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodBrother ]
      max: 1
      playerRatio: 1
      briefing:
        text: blood-brother-initial-role-greeting
        color: MediumVioletRed
        sound: /Audio/_Harmony/Misc/blood_brother_greeting.ogg
      components:
      - type: BloodBrother
      - type: InitialBloodBrother
      mindRoles:
      - MindRoleBloodBrother

- type: entity
  parent: BaseGameRule
  id: Malfunction
  components:
  - type: GameRule
    minPlayers: 15
    cancelPresetOnTooFewPlayers: false
  - type: MalfunctioningAIRule
  - type: AntagObjectives
    objectives: 
    - MalfPreventDeactivationObjective
  - type: AntagRandomObjectives
    sets:
    - groups: MalfunctionPrimeObjectiveGroup
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: malf-round-end-agent-name
    selectionTime: PostPlayerSpawn
    definitions:
    - prefRoles: [ MalfunctioningAI ]
      ignoreJob: true
      max: 1
      playerRatio: 1
      lateJoinAdditional: true
      allowNonHumans: true
      whitelist:
        components: 
        - StationAiHeld
      mindRoles:
      - MindRoleMalfunctioningAI
      briefing:
        sound: "/Audio/Ambience/Antag/malf_start.ogg"
        text: malf-role-greeting
        color: Crimson
