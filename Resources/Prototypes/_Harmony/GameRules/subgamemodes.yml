- type: entity
  parent: BaseGameRule
  id: BloodBrothers
  components:
  - type: GameRule
    minPlayers: 10
    cancelPresetOnTooFewPlayers: false
    delay:
      min: 240
      max: 420
  - type: BloodBrotherRule
  - type: AntagRandomObjectives
    sets:
    - groups: BloodBrotherObjectiveGroups
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: blood-brothers-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodBrother ]
      max: 1
      playerRatio: 1
      briefing:
        text: blood-brother-initial-role-greeting
        color: MediumVioletRed
        sound: /Audio/_Harmony/Misc/blood_brother_greeting.ogg
      components:
      - type: BloodBrother
      - type: InitialBloodBrother
      mindRoles:
      - MindRoleBloodBrother

- type: entity
  parent: BaseGameRule
  id: Malfunction
  components:
  - type: GameRule
    minPlayers: 30
    cancelPresetOnTooFewPlayers: false
  - type: MalfunctioningAIRule
  - type: AntagObjectives
    objectives: 
    - MalfPreventDeactivationObjective
  - type: AntagRandomObjectives
    sets:
    - groups: MalfunctionPrimeObjectiveGroup
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: malf-round-end-agent-name
    selectionTime: PostPlayerSpawn
    definitions:
    - prefRoles: [ MalfunctioningAI ]
      ignoreJob: true
      max: 1
      playerRatio: 1
      lateJoinAdditional: true
      allowNonHumans: true
      whitelist:
        components: 
        - StationAiHeld
      mindRoles:
      - MindRoleMalfunctioningAI
      briefing:
        sound: "/Audio/_Harmony/Misc/malf_start.ogg"
        text: malf-role-greeting
        color: Crimson
      components:
      - type: MalfAbilities
      - type: MalfunctioningAIRole
      - type: Store
        name: store-preset-name-malf
        categories:
        - MalfAIStoreActions
        - MalfAIStoreAbilities
        currencyWhitelist:
        - CPU
        balance: 
          CPU: 50
      - type: UserInterface # i have to include all of the regular AI stuff too because otherwise it doesn't work for some reason
        interfaces:
          enum.StoreUiKey.Key:
            type: StoreBoundUserInterface
          enum.RadarConsoleUiKey.Key:
            type: RadarConsoleBoundUserInterface
          enum.CrewMonitoringUIKey.Key:
            type: CrewMonitoringBoundUserInterface
          enum.GeneralStationRecordConsoleKey.Key:
            type: GeneralStationRecordConsoleBoundUserInterface
          enum.SiliconLawsUiKey.Key:
            type: SiliconLawBoundUserInterface
          enum.CommunicationsConsoleUiKey.Key:
            type: CommunicationsConsoleBoundUserInterface
          enum.VoiceMaskUIKey.Key: # malf module: voice modulation
            type: VoiceMaskBoundUserInterface
