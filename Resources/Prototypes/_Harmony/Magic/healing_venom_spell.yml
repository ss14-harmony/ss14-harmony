- type: entity
  parent: BaseActionChangelingSting
  id: ActionHealingVenomSpell
  name: Healing Venom
  description: Let you venom heal your allies.
  components:
  - type: Action
    useDelay: 30
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _Harmony/Objects/Magic/magicactions.rsi
      state: healing_bite
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: Omnizine
      quantity: 8
  - type: DoAfterArgs
    delay: 3
    breakOnDamage: true
    breakOnMove: true
  - type: PopupOnAction
    popupType: Medium
    selfMessage: gizzard-bite-success
