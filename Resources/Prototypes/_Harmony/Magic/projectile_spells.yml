- type: entity
  parent: BaseAction
  id: ActionWehball
  name: Weball
  description: Forcibly fires a lizard plushie at your target.
  components:
  - type: Magic
  - type: Action
    useDelay: 2
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Fun/Plushies/lizard.rsi
      state: icon
  - type: TargetAction
    range: 60
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileWehball
  - type: SpeakOnAction
    sentence: action-speech-spell-wehball

