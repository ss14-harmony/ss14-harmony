- type: gameMap
  id: Athena
  mapName: 'Athena'
  mapPath: /Maps/_Harmony/athena.yml
  minPlayers: 30
  maxPlayers: 70
  stations:
    Athena:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Athena {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Harmony/Shuttles/emergency_chariot.yml
        - type: StationJobs
          availableJobs: # teach and learn map, so only engineers/atmos are required roundstart
            #service
            Captain: [ 0, 1 ]
            HeadOfPersonnel: [ 0, 1 ]
            Bartender: [ 0, 2 ]
            Botanist: [ 0, 2 ]
            Chef: [ 0, 2 ]
            Janitor: [ 0, 3 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 3 ]
            #engineering
            ChiefEngineer: [ 0, 1 ]
            AtmosphericTechnician: [ 1, 4 ]
            StationEngineer: [ 2, 5 ]
            TechnicalAssistant: [ 0, 4 ]
            #medical
            ChiefMedicalOfficer: [ 0, 1 ]
            Chemist: [ 0, 3 ]
            MedicalDoctor: [ 0, 4 ]
            MedicalIntern: [ 0, 4 ]
            Paramedic: [ 0, 1 ]
            #science
            ResearchDirector: [ 0, 1 ]
            Scientist: [ 0, 4 ]
            ResearchAssistant: [0, 3]
            #security
            HeadOfSecurity: [ 0, 1 ]
            Warden: [ 0, 1 ]
            Detective: [ 0, 1 ]
            SecurityOfficer: [ 0, 5 ]
            SecurityCadet: [ 0, 4 ]
            Lawyer: [ 0, 2 ]
            #supply
            Quartermaster: [ 0, 1 ]
            SalvageSpecialist: [ 0, 4 ]
            CargoTechnician: [ 0, 4 ]
            #civillian
            Passenger: [ -1, -1 ]
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            Reporter: [ 0, 2 ]
            #silicon
            StationAi: [ 0, 1 ]
            Borg: [ 0, 2 ]