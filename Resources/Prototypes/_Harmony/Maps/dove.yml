- type: gameMap
  id: Dove
  mapName: 'Dove'
  mapPath: /Maps/_Harmony/dove.yml
  minPlayers: 1
  maxPlayers: 35
  stations:
    Dove:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Dove Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
        - type: StationJobs
          availableJobs: # 43 jobs total w/o latejoins & interns, 50 jobs total w/ latejoins & interns
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (10)
            Bartender: [ 0, 1 ]
            Botanist: [ 0, 1 ]
            Chef: [ 0, 1 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 1 ]
            Boxer: [ 0, 1 ]
            Reporter: [ 0, 1 ]
            #engineering (4-5)
            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 1, 3 ]
            TechnicalAssistant: [ 0, 1 ] #intern, not counted
            #medical (5)
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 1, 2 ]
            Paramedic: [ 0, 1 ]
            Psychologist: [ 0, 1 ]
            MedicalIntern: [ 0, 1 ] #intern, not counted
            #science (2)
            Scientist: [ 1, 2 ]
            ResearchAssistant: [ 0, 1 ] #intern, not counted
            #security (5-6)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 1, 3 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 0, 1 ] #intern, not counted
            Lawyer: [ 0, 1 ]
            #supply (4-5)
            SalvageSpecialist: [ 1, 2 ]
            CargoTechnician: [ 1, 3 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            #silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 0, 2 ]
