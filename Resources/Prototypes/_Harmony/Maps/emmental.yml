- type: gameMap
  id: Emmental
  mapName: 'Emmental'
  mapPath: /Maps/_Harmony/emmental.yml
  minPlayers: 15
  maxPlayers: 55
  stations:
    Emmental:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Emmental {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Harmony/Shuttles/emergency_chariot.yml
        - type: StationJobs
          availableJobs: # 48 jobs total w/o latejoins & interns, 68 jobs total w/ latejoins & interns
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (10 - 13)
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Janitor: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            ServiceWorker: [ 1, 2 ]
            #engineering (5 - 7)
            AtmosphericTechnician: [ 2, 3 ]
            StationEngineer: [ 3, 4 ]
            TechnicalAssistant: [ 2, 2 ] #intern, not counted
            #medical (6 - 8)
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 2, 3 ]
            MedicalIntern: [ 2, 2 ] #intern, not counted
            Paramedic: [ 1, 2 ]
            Psychologist: [ 1, 1 ]
            #science (2 - 3)
            Scientist: [ 2, 3 ]
            ResearchAssistant: [ 2, 2 ] #intern, not counted
            #security (7 - 8)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 4, 5 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 1, 2 ] #intern, not counted
            Lawyer: [ 1, 1 ]
            #supply (4 - 6)
            SalvageSpecialist: [ 2, 3 ]
            CargoTechnician: [ 2, 3 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 2, 3 ]
