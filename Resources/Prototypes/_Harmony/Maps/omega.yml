- type: gameMap
  id: Omega
  mapName: 'Omega'
  mapPath: /Maps/_Harmony/omega.yml
  minPlayers: 1
  maxPlayers: 35
  stations:
    Omega:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Omega Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_omega.yml
        - type: StationJobs
          availableJobs: # 48 jobs total without interns, 56 jobs total with interns
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (10)
            Bartender: [ 0, 1 ]
            Botanist: [ 0, 2 ]
            Chef: [ 0, 1 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 2 ]
            #engineering (5)
            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 1, 3 ]
            TechnicalAssistant: [ 0, 2 ] #intern, not counted
            #medical (6)
            Chemist: [ 1, 2 ]
            MedicalDoctor: [ 1, 3 ]
            Paramedic: [ 0, 1 ]
            MedicalIntern: [ 0, 2 ] #intern, not counted
            #science (3)
            Scientist: [ 1, 3 ]
            ResearchAssistant: [ 0, 2 ] #intern, not counted
            #security (7)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 1, 4 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 0, 2 ] #intern, not counted
            Lawyer: [ 0, 1 ]
            #supply (4)
            SalvageSpecialist: [ 1, 2 ]
            CargoTechnician: [ 1, 2 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            #silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 0, 2 ]
