- type: gameMap
  id: Panopticon
  mapName: 'Panopticon'
  mapPath: /Maps/_Harmony/panopticon.yml
  minPlayers: 25
  maxPlayers: 50
  stations:
    Panopticon:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Panopticon {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_rod.yml
      - type: StationJobs
        availableJobs: # X jobs total w/o latejoins & interns, X jobs total w/ latejoins & interns
          #command (7)
          Captain: [ 1, 1 ]
          HeadOfPersonnel: [ 1, 1 ]
          HeadOfSecurity: [ 1, 1 ]
          ChiefMedicalOfficer: [ 1, 1 ]
          ChiefEngineer: [ 1, 1 ]
          ResearchDirector: [ 1, 1 ]
          Quartermaster: [ 1, 1 ]
          #service (11)
          Bartender: [ 2, 2 ]
          Botanist: [ 2, 2 ]
          Chef: [ 2, 2 ]
          Janitor: [ 1, 1 ]
          Chaplain: [ 1, 1 ]
          Librarian: [ 1, 1 ]
          ServiceWorker: [ 2, 2 ]
          #engineering (6)
          AtmosphericTechnician: [ 2, 2 ]
          StationEngineer: [ 4, 4 ]
          TechnicalAssistant: [ 2, 2 ] #intern, not counted
          #medical (7)
          Chemist: [ 2, 2 ]
          MedicalDoctor: [ 4, 4 ]
          MedicalIntern: [ 2, 2 ] #intern, not counted
          Paramedic: [ 1, 1 ]
          #science (4)
          Scientist: [ 4, 4 ]
          ResearchAssistant: [ 2, 2 ] #intern, not counted
          #security (7)
          Warden: [ 1, 1 ]
          SecurityOfficer: [ 5, 5 ]
          Detective: [ 1, 1 ]
          SecurityCadet: [ 2, 2 ] #intern, not counted
          Lawyer: [ 1, 1 ]
          #supply (5)
          SalvageSpecialist: [ 2, 2 ]
          CargoTechnician: [ 3, 3 ]
          #civilian (3+)
          Passenger: [ -1, -1 ] #infinite, not counted
          Clown: [ 1, 1 ]
          Mime: [ 1, 1 ]
          Musician: [ 1, 1 ]
          #silicon (3)
          StationAi: [ 1, 1 ]
          Borg: [ 2, 2 ]