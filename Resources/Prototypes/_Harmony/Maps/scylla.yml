- type: gameMap
  id: Scylla
  mapName: 'Scylla'
  mapPath: /Maps/_Harmony/scylla.yml
  minPlayers: 20
  maxPlayers: 55
  stations:
    Scylla:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Scylla {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TL'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Harmony/Shuttles/emergency_charybdis.yml
        - type: StationCargoShuttle
          path: /Maps/_Harmony/Shuttles/cargo_scylla.yml
        - type: StationJobs
          availableJobs:
            #command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (10 - 11)
            Bartender: [ 0, 1 ]
            Botanist: [ 0, 1 ]
            Chef: [ 0, 1 ]
            Janitor: [ 0, 2 ]
            Chaplain: [ 0, 1 ]
            Librarian: [ 0, 1 ]
            ServiceWorker: [ 0, 2 ]
            Reporter: [ 0, 2 ]
            #engineering (6)
            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 1, 4 ]
            TechnicalAssistant: [ 0, 2 ] #intern, not counted
            #medical (7)
            Chemist: [ 1, 2 ]
            MedicalDoctor: [ 1, 3 ]
            Paramedic: [ 0, 1 ]
            Psychologist: [ 0, 1 ]
            MedicalIntern: [ 0, 2 ] #intern, not counted
            #science (4)
            Scientist: [ 1, 4 ]
            ResearchAssistant: [ 0, 2 ] #intern, not counted
            #security (7)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 1, 4 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 0, 2 ] #intern, not counted
            Lawyer: [ 0, 1 ]
            #supply (4)
            SalvageSpecialist: [ 1, 2 ]
            CargoTechnician: [ 1, 2 ]
            #civilian (3+)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 0, 1 ]
            Mime: [ 0, 1 ]
            Musician: [ 0, 1 ]
            #silicon (3)
            StationAi: [ 1, 1 ]
            Borg: [ 0, 2 ]
