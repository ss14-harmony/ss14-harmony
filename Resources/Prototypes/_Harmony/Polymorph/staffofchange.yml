- type: polymorph
  id: WizardForcedBorg
  configuration:
    entity: PlayerBorgBattery
    forced: true
    inventory: None
    transferName: true
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: true
    allowRepeatedMorphs: true
    polymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
    exitPolymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg

