- type: entity
  id: ActionPleebnarTelepathy
  name: Telepathy
  parent: BaseAction
  description: Send an inscrutable vision to a target.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _Harmony/Mobs/Aliens/pleebnar.rsi
      state: telepathy
  - type: TargetAction
    range: 15
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:PleebnarTelepathyEvent
    canTargetSelf: false

- type: entity
  id: ActionPleebnarVision
  name: Select vision
  parent: BaseAction
  description: Select a vision to send.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Harmony/Mobs/Aliens/pleebnar.rsi
      state: select
  - type: InstantAction
    event: !type:PleebnarVisionEvent

- type: entity
  id: ActionPleebnarGib
  parent: BaseAction
  name: Gib
  description: Gib a small animal with your mind powers!
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _Harmony/Mobs/Aliens/pleebnar.rsi
      state: gib
  - type: TargetAction
    range: 15
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:PleebnarGibEvent
