- type: entity
  id: BasePleebnarOrganUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Organ
  - type: Edible
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Gray/organs.rsi
  - type: StaticPrice
    price: 50
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - cigarettes

- type: entity
  id: BasePleebnarOrgan
  parent: BasePleebnarOrganUnGibbable
  abstract: true
  components:
  - type: GibbableOrgan

- type: entity
  id: OrganPleebnarLungs
  parent: BasePleebnarOrgan
  name: yupp
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Organ
    category: Lungs # Harmony Change Organ
  - type: Lung
  - type: Metabolizer
    # Harmony Change Start, Metabolizer is Differnt
    # removeEmpty: true
    #solutionOnBody: false
    # solution: "Lung"
    # Harmony Change End
    metabolizerTypes: [ Animal ]
    stages: [ Respiration ]
    # Harmony Change Start, Metabolizer is Differnt
    # groups:
    # - id: Gas
    #   rateModifier: 100.0
    # Harmony Change End
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Item
    size: Small
    heldPrefix: lungs


- type: entity
